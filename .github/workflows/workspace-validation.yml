name: Workspace validation

on:
  push:
    branches: ['redesign/discord-cloud']
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: workspace-validation-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Install browser regression tooling
        run: |
          python -m pip install -r tests/browser/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Run application regression tests
        run: npm test
      - name: Build production renderer
        run: npm run build
      - name: Validate Studio plugin source and generated XML
        run: |
          python scripts/build_plugin.py
          python -m unittest discover -s tests -p test_plugin_build.py -v
      - name: Verify navigation, Quick Apply and draft recovery
        run: npm run test:ui
      - name: Verify split workspace with real Monaco
        run: npm run test:ui:workspace
      - name: Verify large places and script bundles
        run: |
          npm run test:ui:load
          npm run test:ui:stability
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workspace-regression-artifacts
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
  validate-windows-package:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Run Node regression tests on Windows
        run: npm test
      - name: Package local Windows candidate without publishing
        run: npm run package:win
      - name: Verify installer and unpacked application
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          if (!(Test-Path "release/Cursor-Bridge-Setup-$version.exe")) { throw 'Windows installer missing' }
          if (!(Test-Path 'release/win-unpacked/resources/app.asar')) { throw 'Packaged application missing' }
          $expectedElectron = node -p "require('./package.json').devDependencies.electron"
          $env:ELECTRON_RUN_AS_NODE = '1'
          try {
            $runtime = & '.\release\win-unpacked\Cursor Bridge.exe' -p 'JSON.stringify(process.versions)' | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0) { throw 'Packaged runtime inspection failed.' }
            if ($runtime.electron -ne $expectedElectron -or $runtime.node -ne '24.22.1') {
              throw "Unexpected packaged runtime: Electron $($runtime.electron), Node.js $($runtime.node)."
            }
            Write-Host "Packaged runtime verified: Electron $($runtime.electron), Node.js $($runtime.node)."
          } finally {
            Remove-Item Env:ELECTRON_RUN_AS_NODE
          }

