name: Build and publish Windows release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cursor-bridge-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - name: Check out release source
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python for Studio plugin validation
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate release version and destination
        id: release_meta
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $tag = if ('${{ github.event_name }}' -eq 'workflow_dispatch') { "v$version" } else { '${{ github.ref_name }}' }
          $repository = '${{ github.repository }}'
          $owner = node -p "require('./package.json').build.publish[0].owner"
          $repo = node -p "require('./package.json').build.publish[0].repo"
          $releaseType = node -p "require('./package.json').build.publish[0].releaseType"

          if ($tag -ne "v$version") { throw "Tag $tag must match package.json version v$version." }
          if ("$owner/$repo" -cne $repository) { throw "Publisher destination $owner/$repo must match $repository." }
          if ($releaseType -ne 'release') { throw 'releaseType must be release to publish public downloadable assets.' }
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Install dependencies
        shell: pwsh
        run: |
          if (Test-Path package-lock.json) { npm ci --no-audit --no-fund }
          else { npm install --no-audit --no-fund }

      - name: Run application regression tests
        run: npm test

      - name: Build renderer
        run: npm run build

      - name: Build Roblox Studio plugin
        run: python scripts/build_plugin.py

      - name: Validate Roblox XML plugin integrity
        run: python -m unittest discover -s tests -p test_plugin_build.py -v

      - name: Create matching version tag for manual release
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          $tag = '${{ steps.release_meta.outputs.tag }}'
          git fetch --tags
          if ((git tag --list $tag) -eq $tag) {
            $existingCommit = git rev-list -n 1 $tag
            if ($existingCommit -ne '${{ github.sha }}') {
              throw "The $tag tag points to another commit. Increment package.json version before publishing a new release."
            }
          } else {
            git tag $tag
            git push origin "refs/tags/$tag"
          }

      - name: Build Windows installer without parallel publishing
        shell: pwsh
        run: npx electron-builder --win nsis --publish never

      - name: Publish one atomic GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = '${{ steps.release_meta.outputs.tag }}'
          $assets = @(Get-ChildItem -Path release -File | Where-Object {
            $_.Name -match '\.(exe|blockmap)
      - name: Verify release is publicly published
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $isDraft = gh release view '${{ steps.release_meta.outputs.tag }}' --json isDraft --jq '.isDraft'
          if ($LASTEXITCODE -ne 0 -or $isDraft -ne 'false') { throw 'The release is still a draft and cannot be downloaded publicly.' }
 -or $_.Name -eq 'latest.yml'
          } | Select-Object -ExpandProperty FullName)
          $assets += (Resolve-Path 'CursorBridgeV2.rbxmx').Path
          if (-not ($assets | Where-Object { $_ -match '\.exe
      - name: Verify release is publicly published
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $isDraft = gh release view '${{ steps.release_meta.outputs.tag }}' --json isDraft --jq '.isDraft'
          if ($LASTEXITCODE -ne 0 -or $isDraft -ne 'false') { throw 'The release is still a draft and cannot be downloaded publicly.' }
 }) -or
              -not ($assets | Where-Object { $_ -match 'latest\.yml
      - name: Verify release is publicly published
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $isDraft = gh release view '${{ steps.release_meta.outputs.tag }}' --json isDraft --jq '.isDraft'
          if ($LASTEXITCODE -ne 0 -or $isDraft -ne 'false') { throw 'The release is still a draft and cannot be downloaded publicly.' }
 }) -or
              -not ($assets | Where-Object { $_ -match '\.rbxmx
      - name: Verify release is publicly published
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $isDraft = gh release view '${{ steps.release_meta.outputs.tag }}' --json isDraft --jq '.isDraft'
          if ($LASTEXITCODE -ne 0 -or $isDraft -ne 'false') { throw 'The release is still a draft and cannot be downloaded publicly.' }
 })) {
            throw 'Missing required release assets.'
          }
          gh release create $tag $assets --title $tag --notes "Cursor Bridge $tag" --latest --verify-tag
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release publication failed.' }

      - name: Verify release is publicly published
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $isDraft = gh release view '${{ steps.release_meta.outputs.tag }}' --json isDraft --jq '.isDraft'
          if ($LASTEXITCODE -ne 0 -or $isDraft -ne 'false') { throw 'The release is still a draft and cannot be downloaded publicly.' }
