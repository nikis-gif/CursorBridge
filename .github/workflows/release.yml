name: Build and publish Windows release

on:
  push:
    branches: ['main']
    paths: ['package.json']
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cursor-bridge-release
  cancel-in-progress: false

jobs:
  regression:
    uses: ./.github/workflows/workspace-validation.yml
    permissions:
      contents: read

  windows-release:
    needs: regression
    runs-on: windows-latest
    steps:
      - name: Check out release source
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python for Studio plugin validation
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate release version and destination
        id: release_meta
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $tag = if ('${{ github.ref_type }}' -eq 'tag') { '${{ github.ref_name }}' } else { "v$version" }
          $repository = '${{ github.repository }}'
          $owner = node -p "require('./package.json').build.publish[0].owner"
          $repo = node -p "require('./package.json').build.publish[0].repo"
          $releaseType = node -p "require('./package.json').build.publish[0].releaseType"

          if ($tag -ne "v$version") { throw "Tag $tag must match package.json version v$version." }
          if ("$owner/$repo" -cne $repository) { throw "Publisher destination $owner/$repo must match $repository." }
          if ($releaseType -ne 'release') { throw 'releaseType must be release to publish public downloadable assets.' }
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Install dependencies
        shell: pwsh
        run: |
          if (Test-Path package-lock.json) { npm ci --no-audit --no-fund }
          else { npm install --no-audit --no-fund }

      - name: Run application regression tests
        run: npm test

      - name: Build renderer
        run: npm run build

      - name: Build Roblox Studio plugin
        run: python scripts/build_plugin.py

      - name: Validate Roblox XML plugin integrity
        run: python -m unittest discover -s tests -p test_plugin_build.py -v

      - name: Build Windows installer without publishing
        shell: pwsh
        run: npx electron-builder --win nsis --publish never

      - name: Verify updater manifest matches installer
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $expected = "Cursor-Bridge-Setup-$version.exe"
          $installerPath = Join-Path 'release' $expected
          $manifestPath = Join-Path 'release' 'latest.yml'
          if (-not (Test-Path -LiteralPath $installerPath)) { throw "Expected installer missing: $expected" }
          if (-not (Test-Path -LiteralPath $manifestPath)) { throw 'Missing latest.yml' }
          $manifest = Get-Content -LiteralPath $manifestPath -Raw
          $base64Sha = [Convert]::ToBase64String([System.Security.Cryptography.SHA512]::HashData([IO.File]::ReadAllBytes((Resolve-Path $installerPath).Path)))
          $size = (Get-Item -LiteralPath $installerPath).Length
          if (-not $manifest.Contains("path: $expected")) { throw 'latest.yml path does not match installer name' }
          if (-not $manifest.Contains("sha512: $base64Sha")) { throw 'latest.yml checksum does not match installer' }
          if (-not $manifest.Contains("size: $size")) { throw 'latest.yml size does not match installer' }

      - name: Create matching version tag for branch or manual release
        if: github.ref_type != 'tag'
        shell: pwsh
        run: |
          $tag = '${{ steps.release_meta.outputs.tag }}'
          git fetch --tags
          if ((git tag --list $tag) -eq $tag) {
            $existingCommit = git rev-list -n 1 $tag
            if ($existingCommit -ne '${{ github.sha }}') {
              throw "The $tag tag points to another commit. Increment package.json version before publishing a new release."
            }
          } else {
            git tag $tag
            git push origin "refs/tags/$tag"
          }

      - name: Publish one complete GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = '${{ steps.release_meta.outputs.tag }}'
          $version = node -p "require('./package.json').version"
          $installer = Get-Item -LiteralPath (Join-Path 'release' "Cursor-Bridge-Setup-$version.exe")
          $blockmap = Get-Item -LiteralPath (Join-Path 'release' "Cursor-Bridge-Setup-$version.exe.blockmap")
          $metadata = Join-Path $PWD 'release/latest.yml'
          $studioPlugin = Join-Path $PWD 'CursorBridgeV2.rbxmx'
          if ($null -eq $installer) { throw 'Windows installer is missing.' }
          if ($null -eq $blockmap) { throw 'Installer blockmap is missing.' }
          if (-not (Test-Path -LiteralPath $metadata)) { throw 'latest.yml is missing.' }
          if (-not (Test-Path -LiteralPath $studioPlugin)) { throw 'Roblox plugin is missing.' }
          $assets = @($installer.FullName, $blockmap.FullName, $metadata, $studioPlugin)
          $notesFile = Join-Path 'docs' "RELEASE_$($version.Replace('.', '_')).md"
          if (Test-Path -LiteralPath $notesFile) {
            gh release create $tag $assets --title "Cursor Bridge $tag" --notes-file $notesFile --latest --verify-tag
          } else {
            gh release create $tag $assets --title "Cursor Bridge $tag" --notes "Cursor Bridge $tag" --latest --verify-tag
          }
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release publication failed.' }

      - name: Verify public release and assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = '${{ steps.release_meta.outputs.tag }}'
          $isDraft = gh release view $tag --json isDraft --jq '.isDraft'
          if ($LASTEXITCODE -ne 0 -or $isDraft -ne 'false') { throw 'Release is not public.' }
          $assetNames = @(gh release view $tag --json assets --jq '.assets[].name')
          if ($LASTEXITCODE -ne 0) { throw 'Could not verify release assets.' }
          if (-not ($assetNames -contains 'CursorBridgeV2.rbxmx')) { throw 'Studio plugin missing from release.' }
          if (-not ($assetNames -contains 'latest.yml')) { throw 'Update metadata missing from release.' }
          if (-not ($assetNames | Where-Object { $_ -like '*.exe' })) { throw 'Windows installer missing from release.' }
