name: Prepare polish workspace
on:
  push:
    branches: ['polish/minimal-workspace-v031']
    paths: ['.github/workflows/prepare-polish.yml']
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Export source and exact dependencies for local verification
        run: |
          tar -czf /tmp/polish-workspace.tar.gz --exclude=.git --exclude=node_modules/electron/dist --exclude=node_modules/app-builder-bin --exclude=node_modules/7zip-bin --exclude=release .
      - uses: actions/upload-artifact@v4
        with:
          name: polish-workspace
          path: /tmp/polish-workspace.tar.gz
          retention-days: 3
